{extend name="base" /} {block name="main"}
<!-- neibanner -->
{ld:sort cid="$topid"}
<div class="neibanner">
    <img src="{$item.big_image}" alt="{$item.name}" />
    <div class="neibannerdesc">
        <div class="container neibannerdesc-title">
            <p>{$item.ename}</p>
            <h2>{$item.name}</h2>
        </div>


    </div>
</div>
{/ld:sort}
<!-- neibanner end -->

<!-- 内页导航 -->
{include file="neinav" /}
<!-- 内页导航 end -->

<section class="page-content">
    <div class="container">
        <div class="page-content-card card">
            <div class="card-body rich-text-content">{$content.content}</div>
            <div class="card-body" style="display: none;">{$content.cpcs}</div>
        </div>
    </div>
</section>
{/block}

{extend name="base" /} {block name="main"}
<!-- neibanner -->
{ld:sort cid="$topid"}
<div class="neibanner">
    <img src="{$item.big_image}" alt="{$item.name}" />
    <div class="neibannerdesc">
        <div class="container neibannerdesc-title">
            <p>{$item.ename}</p>
            <h2>{$item.name}</h2>
        </div>
    </div>
</div>
{/ld:sort}
<!-- neibanner end -->

<!-- 内页导航 -->
{include file="neinav" /}
<!-- 内页导航 end -->

<section class="page-list product-wrapper m-5">
    <div class="container">
        <!-- 移动端筛选按钮 -->
        <button class="mobile-filter-btn d-lg-none">
            <i class="fa fa-filter"></i>
            <span>筛选</span>
        </button>

        <!-- 移动端筛选遮罩层 -->
        <div class="mobile-filter-overlay d-lg-none"></div>

        <div class="row">
            <!-- 左侧筛选区域 -->
            <div class="col-lg-3 col-md-4 mobile-filter-wrapper">
                {include file="product_filter" /}
            </div>

            <!-- 右侧产品列表区域 -->
            <div class="col-lg-9 col-md-8">
                <div class="product-list row">
                    {ld:list limit='999' page='false' random_from_subcategory='true'}
                    <div class="product-item col-lg-4 col-md-6 col-sm-6">
                        <a href="{$item.url}" class="product-item-wrapper wow fadeInUp" data-wow-delay="0.{$i}s">
                            <div class="pic">
                                <img class="img-fluid" src="{$item.image}" alt="{$item.title}" />
                            </div>
                            <div class="content-wrapper text-center px-3 py-3">
                                <h3 class="product-item-title text-ellipsis">{$item.title}</h3>
                            </div>
                        </a>
                    </div>
                    {/ld:list}
                </div>
            </div>
        </div>
    </div>
</section>
{/block}
